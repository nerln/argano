name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "tools/*.html", "tools/*.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The engine that runs in the page is tested before the page ships. Both
      # suites answer the same question about the same bytes, which is how two
      # ports of one algorithm are kept from drifting apart.
      - run: node --test web/lib/aac.test.mjs
      - run: node --test web/lib/engine.test.mjs
      # The three language pages are written from tools/page.html and
      # web/i18n.js. A page that was not rewritten after a change to either
      # would ship old words, so the deploy stops here instead.
      - run: node tools/pages.mjs --check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
