<!DOCTYPE html>
<!-- the source of every case page. Names in double braces come from
     tools/cases.mjs and web/i18n.js; run `node tools/pages.mjs` after a change. -->
<html lang="{{locale}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{attr:description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta name="author" content="Eugenio Nerelli">
<meta property="og:type" content="article">
<meta property="og:url" content="{{canonical}}">
<meta property="og:title" content="{{attr:title}}">
<meta property="og:description" content="{{attr:description}}">
<meta name="twitter:card" content="summary">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('argano-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' rx='4' fill='none' stroke='%230a64d8' stroke-width='2.4'/%3E%3Crect x='6.5' y='11' width='13' height='10' rx='1.6' fill='%230a64d8'/%3E%3C/svg%3E">
<link rel="preload" href="{{root}}fonts/mona-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}app.css">
</head>
<body>

<header class="top">
  <a class="wordmark" href="{{homeHref}}" aria-label="argano">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="3" y="7" width="26" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <rect x="6.5" y="11" width="13" height="10" rx="1.6" fill="currentColor"/>
      <rect x="22" y="11" width="3.6" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 2"/>
    </svg>
    <span>argano</span>
  </a>
  <div class="pill" role="group">
    <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
    </svg>
    <nav class="langs" aria-label="{{attr:language}}">{{langnav}}</nav>
    <span class="pill-rule" aria-hidden="true"></span>
    <button class="theme" id="theme" type="button" aria-label="{{attr:theme}}" title="{{attr:theme}}">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7Z"/>
      </svg>
    </button>
  </div>
</header>

<main class="case">
  <h1 class="display case-title">{{h1}}</h1>
  <p class="lead">{{lead}}</p>

  <div class="case-cta">
    <a class="btn main big" href="{{ctaHref}}">{{cta}}</a>
    <p class="fine">{{ctaFine}}</p>
  </div>

  {{body}}

  <div class="case-cta">
    <a class="btn main" href="{{ctaHref}}">{{cta}}</a>
  </div>

  <section class="guides" aria-labelledby="others-title">
    <h2 class="section-title" id="others-title">{{others}}</h2>
    <ul>{{otherLinks}}</ul>
  </section>
</main>

<footer class="foot">
  <p>{{madeBy}} <a href="https://nerln.github.io/" rel="author">Eugenio Nerelli</a>. {{licence}}</p>
  <p><a href="{{root}}privacy.html">{{privacy}}</a> · <a href="{{root}}terms.html">{{terms}}</a></p>
</footer>

<!-- the same theme switch and the same visit count as the tool page, without
     loading the tool: nothing is repaired here. -->
<script>
  (function () {
    document.getElementById('theme').addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('argano-theme', next); } catch (e) {}
    });
    if (location.origin !== 'https://nerln.github.io') return;
    var q = new URLSearchParams({ p: location.pathname, t: document.title, e: 'false',
      r: document.referrer, q: location.search, rnd: Math.random().toString(36).slice(2) });
    fetch('https://nerln.goatcounter.com/count?' + q, { mode: 'no-cors', credentials: 'omit', keepalive: true })
      .catch(function () {});
  })();
</script>
</body>
</html>
